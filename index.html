<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Fraud Case Tracking System</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #334155; --success: #16a34a; --danger: #dc2626; --warning: #ea580c; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1150px; margin: 0 auto; }
        header { background-color: var(--primary); color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        header h1 { margin: 0; font-size: 24px; }
        .form-section { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; transition: border 0.3s; }
        .form-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 5px; }
        input[type="text"], textarea { padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; outline: none; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--accent); }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .btn-secondary { background: #475569; padding: 8px 14px; font-size: 13px; }
        .btn-danger { background: #fee2e2; color: var(--danger); padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
        .search-box { width: 100%; padding: 15px; font-size: 16px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 25px; box-sizing: border-box; }
        .case-card { background: var(--card-bg); border-left: 5px solid var(--accent); padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
        .case-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px; }
        .dc-num { background: #dbeafe; color: var(--accent); padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .accused-name { font-size: 18px; font-weight: 600; margin: 0; color: var(--primary); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .field-title { font-weight: bold; font-size: 12px; color: #64748b; text-transform: uppercase; }
        .field-value { font-size: 14px; margin-top: 2px; line-height: 1.45; white-space: pre-line; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-yes { background: #dcfce7; color: var(--success); }
        .badge-no { background: #fee2e2; color: var(--danger); }
        .card-actions { display: flex; justify-content: flex-end; border-top: 1px solid #f1f5f9; padding-top: 10px; gap: 10px; }
        #noResults { text-align: center; font-size: 16px; color: #94a3b8; padding: 40px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>Disciplinary Committee Fraud Case Tracking System</h1>
            <p>Smart Add & Update Dashboard (Full Archive History Included)</p>
        </div>
        <button class="btn btn-secondary" onclick="restoreDefaults()">🔄 Reload Master Document Records</button>
    </header>

    <!-- SMART FORM ENGINE -->
    <div class="form-section" id="formWrapper">
        <h3 id="formTitle">📥 Add New Case or Update Existing (Enter Matching Case ID)</h3>
        <form id="caseForm">
            <div class="form-grid">
                <div class="form-group"><label>Case ID / DC Number Key</label><input type="text" id="formDc" placeholder="e.g., a, b, Ap, An, Ao" required></div>
                <div class="form-group"><label>Accused Employee Details & ID</label><input type="text" id="formName" placeholder="Employee Name (ID) - Branch" required></div>
            </div>
            <div class="form-grid">
                <div class="form-group"><label>Latest Update Status</label><textarea id="formUpdate" rows="2" required></textarea></div>
                <div class="form-group"><label>Actions to be Taken / Next Deadlines</label><textarea id="formPending" rows="2" required></textarea></div>
            </div>
            <div class="form-grid">
                <div class="form-group"><label>Actions Completed (Full History Log / Done Area)</label><textarea id="formCompleted" rows="4" required></textarea></div>
                <div class="checkbox-group"><input type="checkbox" id="formCeo"><label for="formCeo">Informed to CEO</label></div>
            </div>
            <button type="submit" class="btn" id="submitBtn">Save Changes to Database</button>
        </form>
    </div>

    <input type="text" id="searchBar" class="search-box" placeholder="Type Case Key, Employee Name, ID, or Branch location to filter instantly...">
    <div id="casesContainer"></div>
    <div id="noResults">No records match your tracking query.</div>
</div>

const documentSeedData = JSON.parse(atob(rawCompressedMatrix));
let caseDatabase = JSON.parse(localStorage.getItem('dcDatabase'));
if (!caseDatabase || caseDatabase.length < 5) {
caseDatabase = documentSeedData;
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));

const container = document.getElementById('casesContainer');
const searchBar = document.getElementById('searchBar');
const noResults = document.getElementById('noResults');
const caseForm = document.getElementById('caseForm');
const formDcInput = document.getElementById('formDc');
// LIVE KEY LISTENERS FOR DUAL ENTRY ENGINE
formDcInput.addEventListener('input', (e) => {
const matchingCase = caseDatabase.find(c => c.dc.trim().toLowerCase() === e.target.value.trim().toLowerCase());
const formTitle = document.getElementById('formTitle');
const submitBtn = document.getElementById('submitBtn');
const wrapper = document.getElementById('formWrapper');
if (matchingCase) {
formTitle.innerHTML = 📝 UPDATE MODE active: Modifying Case [Key ID: ${matchingCase.dc}];
formTitle.style.color = "var(--warning)";
wrapper.style.borderColor = "var(--warning)";
submitBtn.innerHTML = "Apply & Save Case Updates";
document.getElementById('formName').value = matchingCase.name;
document.getElementById('formUpdate').value = matchingCase.update;
document.getElementById('formPending').value = matchingCase.pending;
document.getElementById('formCompleted').value = matchingCase.completed || item.history || "";
document.getElementById('formCeo').checked = matchingCase.ceo;
} else {
formTitle.innerHTML = "📥 ADD MODE active: Creating Brand New Record Profile";
formTitle.style.color = "var(--primary)";
wrapper.style.borderColor = "var(--border)";
submitBtn.innerHTML = "Save New Entry to Database";
}
});
function displayCases(data) {
container.innerHTML = "";
if (data.length === 0) { noResults.style.display = "block"; return; }
noResults.style.display = "none";
data.forEach((item, index) => {
const card = document.createElement('div');
card.className = 'case-card';
card.innerHTML = <div class="case-header"> <p class="accused-name">👤 ${item.name}</p> <span class="dc-num">Key ID: ${item.dc}</span> </div> <div class="grid"> <div><div class="field-title">📈 Latest Update Status</div><div class="field-value">${item.update}</div></div> <div><div class="field-title">⚠️ Actions to be Taken</div><div class="field-value">${item.pending}</div></div> </div> <div class="grid"> <div><div class="field-title">✅ Historical Actions Completed (Done Area)</div><div class="field-value">${item.completed || item.history || ""}</div></div> <div><div class="field-title">💼 Informed to CEO</div><div class="field-value"> <span class="badge ${item.ceo ? 'badge-yes' : 'badge-no'}">${item.ceo ? 'YES / OBSERVING' : 'NO / PENDING'}</span> </div></div> </div> <div class="card-actions"> <button class="btn-secondary" onclick="triggerEdit('${item.dc}')">Edit Profile Fields</button> <button class="btn-danger" onclick="deleteCase(${index})">Remove from List</button> </div>;
container.appendChild(card);
});
}
caseForm.addEventListener('submit', (e) => {
e.preventDefault();
const inputKey = document.getElementById('formDc').value.trim();
const targetedCaseIndex = caseDatabase.findIndex(c => c.dc.toLowerCase() === inputKey.toLowerCase());
const targetPayload = {
dc: inputKey,
name: document.getElementById('formName').value,
update: document.getElementById('formUpdate').value,
pending: document.getElementById('formPending').value,
completed: document.getElementById('formCompleted').value,
ceo: document.getElementById('formCeo').checked
};
if (targetedCaseIndex > -1) {
caseDatabase[targetedCaseIndex] = targetPayload;
alert(Case index key ${inputKey} successfully updated!);
} else {
caseDatabase.unshift(targetPayload);
alert(New custom case key ${inputKey} created successfully!);
}
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
caseForm.reset();
document.getElementById('formTitle').innerHTML = "📥 Add New Case or Update Existing (Enter Matching Case ID)";
document.getElementById('formTitle').style.color = "var(--primary)";
document.getElementById('formWrapper').style.borderColor = "var(--border)";
document.getElementById('submitBtn').innerHTML = "Save Changes to Database";
displayCases(caseDatabase);
searchBar.value = "";
});
window.triggerEdit = function(key) {
document.getElementById('formDc').value = key;
formDcInput.dispatchEvent(new Event('input'));
window.scrollTo({ top: caseForm.offsetTop - 20, behavior: 'smooth' });
}
window.deleteCase = function(index) {
if(confirm("Purge profile permanently from browser tracking storage?")) {
caseDatabase.splice(index, 1);
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
displayCases(caseDatabase);
}
}
window.restoreDefaults = function() {
if(confirm("Wipe cache and reload full comprehensive minutes histories?")) {
localStorage.removeItem('dcDatabase');
caseDatabase = documentSeedData;
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
displayCases(caseDatabase);
searchBar.value = "";
}
}
searchBar.addEventListener('input', (e) => {
const query = e.target.value.toLowerCase();
const filtered = caseDatabase.filter(item =>
item.dc.toLowerCase().includes(query) ||
item.name.toLowerCase().includes(query) ||
item.update.toLowerCase().includes(query) ||
(item.completed && item.completed.toLowerCase().includes(query))
);
displayCases(filtered);
});
displayCases(caseDatabase);
