<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Case Tracking System</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --success: #16a34a;
            --danger: #dc2626;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { margin: 0; font-size: 24px; }
        p { margin: 5px 0 0 0; opacity: 0.8; }
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 25px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }
        .case-card {
            background: var(--card-bg);
            border-left: 5px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }
        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .dc-num {
            background: #dbeafe;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .accused-name { font-size: 18px; font-weight: 600; margin: 0; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .field-title { font-weight: bold; font-size: 13px; color: #64748b; text-transform: uppercase; }
        .field-value { font-size: 15px; margin-top: 2px; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-yes { background: #dcfce7; color: var(--success); }
        .badge-no { background: #fee2e2; color: var(--danger); }
        #noResults {
            text-align: center;
            font-size: 16px;
            color: #94a3b8;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Disciplinary Committee Fraud Case Tracking System</h1>
        <p>Search live database records by DC Number or Accused Name</p>
    </header>

    <input type="text" id="searchBar" class="search-box" placeholder="Type case code (e.g., 'a', 'Ap') or officer name...">

    <div id="casesContainer"></div>
    <div id="noResults">No records match your search query.</div>
</div>

<script>
    // 1. DATA STORE (Your exact records from the uploaded minutes document)
    const caseDatabase = [
        {
            dc: "a",
            name: "U.V.S.D.Jayarathne (8230)",
            update: "Transferred to In Progress. Bike reversed to Company asset to settle debt.",
            pending: "Get final confirmation on operational closure for CLO.",
            completed: "CLO sent case closure request to HIA on 7th May; resent by CHRO on 24th July 2026.",
            ceo: true
        },
        {
            dc: "b",
            name: "K.Vijayadhasan (8459)",
            update: "Escalated to IGP due to lack of local police action. Referred to DIG Nuwara Eliya.",
            pending: "Follow up with immediate criminal litigation if defense files are withheld.",
            completed: "Letter dispatched by CLO demanding proof. Status reviewed at July 31st session.",
            ceo: true
        },
        {
            dc: "c",
            name: "Sachinthana Piyasena (8231)",
            update: "Court Case 25/492/3/24 ongoing. Final net recovery balance stands at Rs. 13,822.68.",
            pending: "Send accounting numbers to CLO through HR via Chethi's validation.",
            completed: "Settled Rs. 50,200 on Feb 3rd and additional Rs. 50,000 checks on May 13th.",
            ceo: false
        },
        {
            dc: "z",
            name: "Pradeep Dissanayake (9278)",
            update: "Relocated to Gampaha branch closer to home due to health/medical package requests.",
            pending: "DC panel to formally review structural performance metrics at end of September 2026.",
            completed: "Official demotion to Portfolio Manager with custom GWP target applied from Aug 1st.",
            ceo: true
        },
        {
            dc: "Ap",
            name: "A.A.C.M. Peiris - Chathura (9953)",
            update: "Total calculated misappropriation of Rs. 916,490.57 across multiple customer policy loops.",
            pending: "CLO to execute formal criminal branch filing at Cinnamon Gardens Police Station.",
            completed: "Salary locked on July 14th; formal corporate suspension executed by CHRO on July 17th.",
            ceo: true
        },
        {
            dc: "Am",
            name: "Asanga Opatha (9354)",
            update: "Demoted to Manager level. Security/Janitorial wings pulled from portfolio directly into HR.",
            pending: "Reassign and scale down core administrative task operations under target CFO tracking line.",
            completed: "Severe multi-count negligence warning issued following formal disciplinary inquiry panel.",
            ceo: true
        }
    ];

    const container = document.getElementById('casesContainer');
    const searchBar = document.getElementById('searchBar');
    const noResults = document.getElementById('noResults');

    // 2. RENDER ENGINE: Builds visual cards on screen dynamically
    function displayCases(data) {
        container.innerHTML = "";
        if (data.length === 0) {
            noResults.style.display = "block";
            return;
        }
        noResults.style.display = "none";
        
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-header">
                    <p class="accused-name">👤 ${item.name}</p>
                    <span class="dc-num">DC: ${item.dc}</span>
                </div>
                <div class="grid">
                    <div>
                        <div class="field-title">📈 Latest Update</div>
                        <div class="field-value">${item.update}</div>
                    </div>
                    <div>
                        <div class="field-title">⚠️ Actions to be Taken</div>
                        <div class="field-value">${item.pending}</div>
                    </div>
                </div>
                <div class="grid">
                    <div>
                        <div class="field-title">✅ Actions Completed</div>
                        <div class="field-value">${item.completed}</div>
                    </div>
                    <div>
                        <div class="field-title">💼 Informed to CEO</div>
                        <div class="field-value">
                            <span class="badge ${item.ceo ? 'badge-yes' : 'badge-no'}">${item.ceo ? 'YES' : 'NO'}</span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 3. SEARCH ENGINE: Filters text instantly on every keystroke
    searchBar.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = caseDatabase.filter(item => 
            item.dc.toLowerCase().includes(query) || 
            item.name.toLowerCase().includes(query)
        );
        displayCases(filtered);
    });

    // Initial load execution
    displayCases(caseDatabase);
</script>
</body>
</html>
