<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Case Tracking System</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { margin: 0; font-size: 24px; }
        p { margin: 5px 0 0 0; opacity: 0.8; }
        
        /* Form Styling */
        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.05);
        }
        .form-section h3 { margin-top: 0; margin-bottom: 15px; color: var(--primary); }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 5px; }
        input[type="text"], textarea {
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus { border-color: var(--accent); }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: #fee2e2; color: var(--danger); padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #fecaca; }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 25px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }
        
        /* Card Layout */
        .case-card {
            background: var(--card-bg);
            border-left: 5px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
            position: relative;
        }
        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .dc-num {
            background: #dbeafe;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .accused-name { font-size: 18px; font-weight: 600; margin: 0; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .field-title { font-weight: bold; font-size: 13px; color: #64748b; text-transform: uppercase; }
        .field-value { font-size: 15px; margin-top: 2px; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-yes { background: #dcfce7; color: var(--success); }
        .badge-no { background: #fee2e2; color: var(--danger); }
        .card-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
        
        #noResults {
            text-align: center;
            font-size: 16px;
            color: #94a3b8;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Disciplinary Committee Fraud Case Tracking System</h1>
        <p>Upload new data records and track ongoing committee actions live</p>
    </header>

    <!-- NEW INPUT RECORD SYSTEM AREA -->
    <div class="form-section">
        <h3>📥 Upload / Update Case Information</h3>
        <form id="caseForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="formDc">DC Number / Item ID</label>
                    <input type="text" id="formDc" placeholder="e.g., Ba, c, 52" required>
                </div>
                <div class="form-group">
                    <label for="formName">Accused Employee Name & ID</label>
                    <input type="text" id="formName" placeholder="e.g., S.A.D.P.C. Samarathunga (9835)" required>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="formUpdate">Latest Update Status</label>
                    <textarea id="formUpdate" rows="2" placeholder="Describe current status..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="formPending">Actions to be Taken</label>
                    <textarea id="formPending" rows="2" placeholder="List next deadlines..." required></textarea>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="formCompleted">Actions Completed</label>
                    <textarea id="formCompleted" rows="2" placeholder="List finished actions..." required></textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="formCeo">
                    <label for="formCeo">Informed to CEO / Observer Notified</label>
                </div>
            </div>
            <button type="submit" class="btn">Save to System Database</button>
        </form>
    </div>

    <!-- LIVE SEARCH BAR -->
    <input type="text" id="searchBar" class="search-box" placeholder="Type case code or officer name to search instantly...">

    <div id="casesContainer"></div>
    <div id="noResults">No records match your search query.</div>
</div>

<script>
    // Initial core seed data from your document if local storage is clean
    const defaultData = [
        {
            dc: "a",
            name: "U.V.S.D.Jayarathne (8230)",
            update: "Transferred to In Progress. Bike reversed to Company asset to settle debt.",
            pending: "Get final confirmation on operational closure for CLO.",
            completed: "CLO sent case closure request to HIA on 7th May; resent by CHRO on 24th July 2026.",
            ceo: true
        },
        {
            dc: "Ap",
            name: "A.A.C.M. Peiris - Chathura (9953)",
            update: "Total calculated misappropriation of Rs. 916,490.57 across multiple loops.",
            pending: "CLO to execute formal criminal branch filing at Cinnamon Gardens Police Station.",
            completed: "Salary locked on July 14th; formal corporate suspension executed by CHRO on July 17th.",
            ceo: true
        }
    ];

    // 1. DATABASE LOADING: Pull records from browser memory, or use defaults
    let caseDatabase = JSON.parse(localStorage.getItem('dcDatabase'));
    if (!caseDatabase) {
        caseDatabase = defaultData;
        localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
    }

    const container = document.getElementById('casesContainer');
    const searchBar = document.getElementById('searchBar');
    const noResults = document.getElementById('noResults');
    const caseForm = document.getElementById('caseForm');

    // 2. RENDER ENGINE: Draw current cases to screen
    function displayCases(data) {
        container.innerHTML = "";
        if (data.length === 0) {
            noResults.style.display = "block";
            return;
        }
        noResults.style.display = "none";
        
        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-header">
                    <p class="accused-name">👤 ${item.name}</p>
                    <span class="dc-num">DC: ${item.dc}</span>
                </div>
                <div class="grid">
                    <div>
                        <div class="field-title">📈 Latest Update</div>
                        <div class="field-value">${item.update}</div>
                    </div>
                    <div>
                        <div class="field-title">⚠️ Actions to be Taken</div>
                        <div class="field-value">${item.pending}</div>
                    </div>
                </div>
                <div class="grid">
                    <div>
