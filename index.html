 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Fraud Case Tracking System</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header {
            background-color: var(--primary);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        header h1 { margin: 0; font-size: 24px; }
        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 5px; }
        input[type="text"], textarea {
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-secondary { background: #475569; padding: 8px 14px; font-size: 13px; }
        .btn-danger { background: #fee2e2; color: var(--danger); padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .case-card {
            background: var(--card-bg);
            border-left: 5px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }
        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .dc-num {
            background: #dbeafe;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }
        .accused-name { font-size: 18px; font-weight: 600; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .field-title { font-weight: bold; font-size: 12px; color: #64748b; text-transform: uppercase; }
        .field-value { font-size: 14px; margin-top: 2px; line-height: 1.4; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-yes { background: #dcfce7; color: var(--success); }
        .badge-no { background: #fee2e2; color: var(--danger); }
        .card-actions { display: flex; justify-content: flex-end; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        #noResults { text-align: center; font-size: 16px; color: #94a3b8; padding: 40px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Disciplinary Committee Fraud Case Tracking System</h1>
            <p>Comprehensive Data Registry & Live Executive Dashboard</p>
        </div>
        <button class="btn btn-secondary" onclick="restoreDefaults()">🔄 Reload Document Records</button>
    </header>

    <div class="form-section">
        <h3>📥 Upload New Case or Log Update</h3>
        <form id="caseForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>DC Item ID / Case Key</label>
                    <input type="text" id="formDc" required>
                </div>
                <div class="form-group">
                    <label>Accused Employee Details & ID</label>
                    <input type="text" id="formName" required>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Latest Update Status</label>
                    <textarea id="formUpdate" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Actions to be Taken / Next Deadlines</label>
                    <textarea id="formPending" rows="2" required></textarea>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Actions Completed</label>
                    <textarea id="formCompleted" rows="2" required></textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="formCeo">
                    <label for="formCeo">Informed to CEO / Audited by Board</label>
                </div>
            </div>
            <button type="submit" class="btn">Save to Active Database</button>
        </form>
    </div>

    <input type="text" id="searchBar" class="search-box" placeholder="Type Case Key, Employee Name, ID, or Branch location to filter instantly...">

    <div id="casesContainer"></div>
    <div id="noResults">No records match your tracking query.</div>
</div>

{ dc: "y", name: "Asanga Opatha (9354) - Negligence Case 7", update: "Broken chairs issue: Failed to submit new chair proposal to OMC.", pending: "Review timeline response for second show-cause notice.", completed: "Show caused on July 11 for counts 7-15. Granted 14-day extension.", ceo: true },

{ dc: "Ap", name: "A.A.C.M. Peiris - Chathura (9953)", update: "Massive premium rolling fraud across 14 policies totaling Rs. 916,490.57.", pending: "CLO to initiate case entry at Cinnamon Gardens Police Station.", completed: "Suspended on 17th July. Missed final recovery deadline on Aug 19, 2026.", ceo: true },
{ dc: "Ar", name: "Dilum Pathirana (9950) - Nugegoda BM", update: "Rolled customer premium checks to block cancellation loops.", pending: "CHRO to hold Dilum's increments and promotions for year 2026.", completed: "Dilum paid back full Rs. 82,489.94. Policy reinstated July 24, 2026.", ceo: false },
{ dc: "As", name: "M.L.A.I.H. Molligoda (8160)", update: "Defaulted on vehicle loans. Vacated post owing LKR 2,139,383.", pending: "CLO to initiate recovery lawsuit before end of August 2026.", completed: "Field investigations completed. Original CRs title checked July 31, 2026.", ceo: false },
{ dc: "Am", name: "Asanga Opatha (9354) - Final Decision", update: "Established multi-count operational negligence and internal failure.", pending: "Enforce direct reporting and tracking under CFO workspace.", completed: "Demoted to Manager Administration on Aug 1st. Security/Janitorial stripped.", ceo: true }
];
let caseDatabase = JSON.parse(localStorage.getItem('dcDatabase'));
if (!caseDatabase || caseDatabase.length < 5) {
caseDatabase = documentSeedData;
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
}
const container = document.getElementById('casesContainer');
const searchBar = document.getElementById('searchBar');
const noResults = document.getElementById('noResults');
const caseForm = document.getElementById('caseForm');
function displayCases(data) {
container.innerHTML = "";
if (data.length === 0) {
noResults.style.display = "block";
return;
}
noResults.style.display = "none";
data.forEach((item, index) => {
const card = document.createElement('div');
card.className = 'case-card';
card.innerHTML = <div class="case-header"> <p class="accused-name">👤 ${item.name}</p> <span class="dc-num">Key ID: ${item.dc}</span> </div> <div class="grid"> <div> <div class="field-title">📈 Latest Update Status</div> <div class="field-value">${item.update}</div> </div> <div> <div class="field-title">⚠️ Actions to be Taken</div> <div class="field-value">${item.pending}</div> </div> </div> <div class="grid"> <div> <div class="field-title">✅ Actions Completed</div> <div class="field-value">${item.completed}</div> </div> <div> <div class="field-title">💼 Informed to CEO / Audited</div> <div class="field-value"> <span class="badge ${item.ceo ? 'badge-yes' : 'badge-no'}">${item.ceo ? 'YES / VERIFIED' : 'NO / PENDING'}</span> </div> </div> </div> <div class="card-actions"> <button class="btn-danger" onclick="deleteCase(${index})">Remove Case Record</button> </div>;
container.appendChild(card);
});
}
caseForm.addEventListener('submit', (e) => {
e.preventDefault();
const newCase = {
dc: document.getElementById('formDc').value,
name: document.getElementById('formName').value,
update: document.getElementById('formUpdate').value,
pending: document.getElementById('formPending').value,
completed: document.getElementById('formCompleted').value,
ceo: document.getElementById('formCeo').checked
};
caseDatabase.unshift(newCase);
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
caseForm.reset();
displayCases(caseDatabase);
searchBar.value = "";
});
window.deleteCase = function(index) {
if(confirm("Purge this record from tracking memory?")) {
caseDatabase.splice(index, 1);
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
displayCases(caseDatabase);
}
}
window.restoreDefaults = function() {
if(confirm("Reload the base records from the text document?")) {
localStorage.removeItem('dcDatabase');
caseDatabase = documentSeedData;
localStorage.setItem('dcDatabase', JSON.stringify(caseDatabase));
displayCases(caseDatabase);
searchBar.value = "";
alert("Database re-seeded!");
}
}
searchBar.addEventListener('input', (e) => {
const query = e.target.value.toLowerCase();
const filtered = caseDatabase.filter(item =>
item.dc.toLowerCase().includes(query) ||
item.name.toLowerCase().includes(query) ||
item.update.toLowerCase().includes(query)
);
displayCases(filtered);
});
displayCases(caseDatabase);
